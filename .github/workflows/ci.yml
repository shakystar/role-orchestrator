name: pilot
on: [push, pull_request]
permissions:
  contents: read
jobs:
  graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
      - run: uv sync --frozen
      - run: uv run --frozen python -m unittest discover -s tests -p test_graph.py -v
      - run: uv run --frozen python -m unittest discover -s tests -p test_contracts.py -v
      - run: uv run --frozen python -m unittest discover -s tests -p test_observability.py -v
      - run: uv run --frozen python -m unittest discover -s tests -p test_metrics.py -v
      - run: uv run --frozen python -m unittest discover -s tests -p test_workflow_failure_status.py -v
      - run: uv run --frozen python -m unittest discover -s tests -p test_handoff_export.py -v
  integration:
    # Separate private repositories require an explicitly configured read credential.
    # A skipped job is not evidence of a passing integration test.
    if: vars.ROLE_RUNTIME_INTEGRATION == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: shakystar/role-runtime
          ref: 40a3baf4d9a195d565e6ecf9f1532b476c230425
          path: runtime-source
          token: ${{ secrets.ROLE_RUNTIME_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
          cache-dependency-path: runtime-source/go.sum
      - name: Build and test bridge
        working-directory: runtime-source
        run: |
          go test -race ./cmd/runtime-bridge
          go build -o ../runtime-bridge ./cmd/runtime-bridge
          go build -o ../workflow-probe ./experiments/workflowprobe
          go build -o ../runtime-workflow ./cmd/runtime-workflow
          go test -race ./internal/control ./internal/lifecycle ./internal/workflowmodel
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
      - run: uv sync --frozen
      - run: uv run --frozen python -m unittest discover -s tests -v
        env:
          ROLE_RUNTIME_BIN: ./runtime-bridge
          ROLE_WORKFLOW_PROBE_BIN: ./workflow-probe
          ROLE_WORKFLOW_BIN: ./runtime-workflow

      - run: uv run --frozen python -m role_orchestrator.evaluation --runtime-source runtime-source --output artifacts/workflow-evaluation.json
        env:
          ROLE_RUNTIME_BIN: ./runtime-bridge
          ROLE_WORKFLOW_BIN: ./runtime-workflow
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workflow-evaluation
          path: artifacts/workflow-evaluation.json
